name: AI + Classic Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

# Not: pull_request_target KULLANMIYORUZ (secret sızıntısı riski yüksek)

concurrency:
  group: code-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------
  # 1. AI Code Review (PR-Agent)
  # Secret sadece bu job'da kullanılıyor
  # -------------------------------------------------
  ai-review:
    if: github.event.pull_request.draft == false && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: AI Review (PR-Agent)
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PR Agent - Review
        uses: Codium-ai/pr-agent@main
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          pr_reviewer.require_tests_review: true
          pr_reviewer.require_security_review: true
          pr_reviewer.extra_instructions: |
            Focus on:
            - Logic errors and edge cases
            - Security issues (injection, auth, secrets)
            - Performance problems
            - Code readability and maintainability
            - Breaking changes
            Be concise. Prefer concrete suggestions over general advice.
          pr_reviewer.inline_code_comments: true
          pr_reviewer.num_code_suggestions: 4

  # -------------------------------------------------
  # 2. Linter Results → PR Comments (Reviewdog)
  # Bu job secret kullanmaz
  # -------------------------------------------------
  lint-review:
    if: github.event.pull_request.draft == false && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Lint → Reviewdog
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Lint
        run: |
          npm ci || true
          npx eslint . --format json --output-file eslint-report.json || true

      - name: Reviewdog - ESLint
        uses: reviewdog/action-eslint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          eslint_flags: '.'
          fail_on_error: false
          filter_mode: added

  # -------------------------------------------------
  # 3. Security - CodeQL (GitHub native)
  # Bu job secret kullanmaz
  # -------------------------------------------------
  codeql:
    if: github.event.pull_request.draft == false && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: CodeQL Security
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, typescript, python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # -------------------------------------------------
  # 4. Manuel /review komutu
  # Secret sadece burada da kullanılıyor
  # -------------------------------------------------
  manual-review:
    if: |
      github.event_name == 'issue_comment' &&
      contains(github.event.comment.body, '/review') &&
      github.event.issue.pull_request
    runs-on: ubuntu-latest
    name: Manual /review trigger
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0

      - name: PR Agent - Manual Review
        uses: Codium-ai/pr-agent@main
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          pr_reviewer.extra_instructions: "User requested a fresh review with /review command."
